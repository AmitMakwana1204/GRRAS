
name: Deploy All Projects to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare All Projects
        run: |
          mkdir -p _site/Project/Amazon

          # Copy all project folders
          cp -r Project/* _site/Project/

          # Create Amazon homepage
          cp Project/Amazon/Amazon.html \
             _site/Project/Amazon/index.html

          # Disable Jekyll
          touch _site/.nojekyll

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
