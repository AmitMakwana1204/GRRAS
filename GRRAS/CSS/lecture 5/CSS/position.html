<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    .container {
        position: relative;
        width: 200px;
        height: 200px;
        background: green;
        border: 2px solid black
    }

    .box {
        position: fixed;
        top: 20px;
        left: 10px;
    }
    </style>
</head>
<body>
    <div class="container"> Parent Container
    <div class="box"> Child Class </div>
</div>
</body>
</html>

<!-- // we have five types of position in css 
1. static : normal position of content not use external position(right, left)
2. relative: moves to element relatively 
3. absolute:  
4. sticky
5. fixed  -->
