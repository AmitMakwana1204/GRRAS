<!-- // display : The CSS display property define how an HTML elements appears on a webpages and how its occupied the space.
 -->

 <!-- // types of display 
 1. block : starts on a new line, takes full available width by default
 2. inline : does not need to start from the new line, takes the only width required by its content.
3. inline - block : elements appear on the same line when space is availble, here you can set according to height and width, conbination of inline and block display 
4. none : completely hidw the element, the element does not occupy space in the layout of website
5. flex : used to arrange elements in a flexible row or column. its especially using for naviagation bar, product cards, multiple images, etc..
6. grid : row and columns (Ex: bootstrap)
7. inline-flex : provide container like a inline level elements and can sit alongside of the elements, content, etc..
8. inline- grid:  -->
