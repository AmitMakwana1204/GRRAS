<!-- // media query is a part of Advance CSS 

- we have 5 types of frames or screens 
1. desktop : above 768px
2. laptop : 481px to 768px
3. tablet : 481 px to 768px
4. mobile : 480px or below 480px
5. smart watch : 

- max - width, min-width, max-height, min-height
@media (max-width: 800px) -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background-color: blueviolet;
    }

    h2 {
        text-align: center;
        color: white;
    }

    .container {
        display: flex;
        justify-content: center;
        gap: 30px;
        padding: 20px;
    }

    .card {
        background-color: blue;
        color: white;
        width: 30%;
        padding: 20px;
        text-align: center;
        font-size: 20px;
    }

    /* 768px to below 768px */
    @media (max-width : 768px) { 
        .container {
            flex-wrap: wrap;
        }

        .card {
            width: 45%;
            font-size: 22px;
        }
        h2 {
            color: black;
        }
    }

    @media (max-width : 480px) {
        .container {
            flex-direction: column;

        }
        .card {
            width: 100%;
            font-size: 16px;
            padding : 20px
        }

        h2 {
            color : red;
        }
    }
    </style>
</head>

<body>
    <h2> CSS Media query example</h2>
    <div class="container"> 
        <div class="card"> HTML </div>
        <div class="card"> CSS </div>
        <div class="card"> JAVASCRIPT </div>
    </div>
</body>
</html>
