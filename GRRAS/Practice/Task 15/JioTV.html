<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JioTV Navbar</title>

    <link rel="stylesheet" href="style.css">

        <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-expand-lg jio-navbar">

        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center" href="#">

                <img src="./JioTV-logo.png" class="logo" alt="JioTV Logo">

                <span class="jio-logo">JioTV</span>

            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">For You</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">TV Guide</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Premium</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Movies</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Sports</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Specials</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Kids</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">News</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Shows</a>
                    </li>

                </ul>

                <div class="d-flex align-items-center right-menu">

                    <div class="search-box">

                        <i class="fa-solid fa-magnifying-glass" style="color: #ffffff;"></i>

                        <input type="text" placeholder="Search JioTV">

                        <i class="fa-solid fa-microphone mic" style="color: #ffffff;"></i>

                    </div>

                    <div class="profile-icon">

                        <i class="fa-solid fa-user"></i>

                    </div>

                </div>

            </div>

        </div>

    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
