
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Shopping Site in India</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link rel="stylesheet" href="Amazon.css">

</head>

<body>

    <!-- Header Start -->
    <header>

        <div class="navbar">

            <!-- Logo -->
            <div class="nav-logo Border">
                <div class="logo">
                    <img src="./109926-amazon-logo.png" alt="Amazon Logo">
                    <p>.in</p>
                </div>
            </div>

            <!-- Delivery Address -->
            <div class="nav-address Border">

                <div class="address">

                    <p class="address-first">Deliver to</p>

                    <div class="add-icon">
                        <i class="fa-solid fa-location-dot"></i>
                        <p class="address-second">India</p>
                    </div>

                </div>

            </div>

            <!-- Search Bar -->
            <div class="nav-fill">

                <form class="nav-searchbar" action="#" method="get">

                    <!-- Category Dropdown -->
                    <div class="nav-search-scope">

                        <select name="category" class="search-dropdown">

                            <option value="all">All Departments</option>
                            <option value="arts">Arts & Crafts</option>
                            <option value="automotive">Automotive</option>
                            <option value="baby">Baby</option>
                            <option value="beauty">Beauty & Personal Care</option>
                            <option value="books">Books</option>
                            <option value="computers">Computers</option>
                            <option value="deals">Deals</option>
                            <option value="electronics">Electronics</option>
                            <option value="fashion">Fashion</option>
                            <option value="health">Health & Household</option>
                            <option value="kitchen">Home & Kitchen</option>
                            <option value="mens">Men's Fashion</option>
                            <option value="music">Music</option>
                            <option value="sports">Sports & Outdoors</option>
                            <option value="toys">Toys & Games</option>
                            <option value="womens">Women's Fashion</option>

                        </select>

                    </div>

                    <div class="nav-search-field">

                        <input
                            type="text"
                            name="search"
                            placeholder="Search Amazon.in"
                            class="nav-input"
                        >

                    </div>

                    <div class="nav-search-submit">

                        <button type="submit">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>

                    </div>

                </form>

            </div>


            <div class="nav-language Border">

                <i class="fa-solid fa-globe"></i>
                <span>EN</span>
                <i class="fa-solid fa-caret-down"></i>

            </div>

            <div class="nav-account Border">

                <p class="nav-first">Hello, sign in</p>
                <p class="nav-second">
                    Account & Lists
                    <i class="fa-solid fa-caret-down"></i>
                </p>

            </div>


            <div class="nav-returns Border">

                <p class="nav-first">Returns</p>
                <p class="nav-second">& Orders</p>

            </div>

            <div class="nav-cart Border">

                <i class="fa-solid fa-cart-shopping"></i>
                <span>Cart</span>

            </div>

        </div>
    </div>

    </header>
    


</body>

</html>
