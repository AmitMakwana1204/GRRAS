// types of list 
1. order list (numeric, alphabetical value, roman number)
2. unorder List (bullets)

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Order list</h2>
    <ol type="A">
        <li> tea</li>
        <li> coffee</li>
        <li> black coffee</li>
        <li> ice tea</li>
    </ol>

    <ul type="square"> Unorder List
    <li> tea</li>
    <li> coffee</li>
    <li> black coffee</li>
    <li> ice tea</li>
    </ul>
</body>
</html>
