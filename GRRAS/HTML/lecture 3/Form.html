<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form name="" action="" onsubmit="" method=""> 
        <!-- // name : For identity we provide name to our form
        // action : handle backend api 
        // onsubmit : js (logic implemetion) call 
        // methods : 
        1. get : data read and represent the data in browser (this data already stored in database)
        2. post : write data or create data and store in database 
        3. put : write data and update data -->

        <label> User Name: </label>
        <input type="text" id="" placeholder="Enter Your Name" value="" required /> <br />
        <label> Search</label>
        <input type="search" /> <br />
        <input type="number" min="5" max="10" /> <br />
        <input type="password" /> <br />
        <input type="file" /> <br />
        <input type="color" /> <br />
        <input type="range" /> <br />
        <input type="date" min="2000-01-01" max="2003-05-14" /> <br />
        <input type="time" /> <br />
        <input type="datetime-local" />
        <label> Email Address </label>
        <input type="email" />
        <label> Contact Number </label>
        <input type="tel" minlength="10" maxlength="10" />
        <select> 
            <option> Ahmedabad</option>
            <option> surat</option>
            <option> vadodra</option>
            <option> gandhinagar</option>
        </select>
        <textarea col="50" rows="5"> </textarea>
        <label> Gender</label>
        <input type="checkbox" name="gender" value="male" /> male 
        <input type="checkbox" name="gender" value="female" /> female
        <input type="checkbox" name="gender" value="others" /> Others
        <br />
        <button> Submit </button>
    </form>
</body>
</html>
